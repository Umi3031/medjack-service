# МЕДЖЕК Сервис — PostgreSQL ба вэб програмыг хамт асаана.
# Ажиллуулах:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medjack
      POSTGRES_USER: medjack
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env файлд DB_PASSWORD заана уу}
      TZ: Asia/Ulaanbaatar
    volumes:
      - pgdata:/var/lib/postgresql/data   # контейнер устсан ч өгөгдөл хадгалагдана
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medjack -d medjack"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://medjack:${DB_PASSWORD}@db:5432/medjack
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # зөвхөн локалд нээнэ; гаднаас Nginx-ээр дамжина

volumes:
  pgdata:
