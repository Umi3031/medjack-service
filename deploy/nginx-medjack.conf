# Nginx reverse proxy: гаднаас ирсэн HTTP(S) хүсэлтийг програм руу дамжуулна.
# Байршуулах: /etc/nginx/sites-available/medjack
# "service.medjack.mn"-ийг өөрийн домэйн нэрээр солино.
server {
    listen 80;
    server_name service.medjack.mn;

    client_max_body_size 5m;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
